openapi: 3.0.3

info:
  title: Historical Security Price API
  description: The API definitions for managing historical security prices and the external sources they are loaded from
  version: 1.0.0

servers:
  - url: 'http://localhost:23726'
    description: Locally serving the API

paths:
  /historical-prices/data-sources:
    post:
      tags:
        - HistoricalSecurityPriceDataSource
      operationId: createHistoricalSecurityPriceDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceCreate'
      responses:
        '201':
          description: Successfully created the historical security price data source
          headers:
            location:
              required: true
              schema:
                type: string
                nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceRead'
        '400':
          description: Passed invalid parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another historical security price data source with the same name exists already
    get:
      tags:
        - HistoricalSecurityPriceDataSource
      operationId: getHistoricalSecurityPriceDataSources
      responses:
        '200':
          description: Successfully returned the historical security price data sources, or an empty array if none exist
          content:
            application/json:
              schema:
                type: array
                nullable: false
                minItems: 0
                items:
                  $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /historical-prices/data-sources/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identifies a historical security price data source
        schema:
          $ref: '#/components/schemas/Id'
    put:
      tags:
        - HistoricalSecurityPriceDataSource
      operationId: updateHistoricalSecurityPriceDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceUpdate'
      responses:
        '200':
          description: Successfully updated the historical security price data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceRead'
        '400':
          description: Passed invalid parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The historical security price data source to be updated does not exist
        '409':
          description: Optimistic Lock failed
    delete:
      tags:
        - HistoricalSecurityPriceDataSource
      operationId: deleteHistoricalSecurityPriceDataSource
      responses:
        '204':
          description: Successfully deleted the historical security price data source
        '400':
          description: >
            There are data (e.g. historical security prices) referencing this historical security price data source or
            the data source may not be deleted for other reasons
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The historical security price data source to be deleted does not exist

  /securities/{securityId}/historical-prices:
    parameters:
      - in: path
        name: securityId
        required: true
        description: identifies the security
        schema:
          $ref: '#/components/schemas/Id'
    get:
      parameters:
        - in: query
          name: startDate
          required: false
          description: Date of the oldest historical price
          schema:
            type: string
            format: date
            nullable: false
            example: 2021-01-01
        - in: query
          name: currency
          required: false
          description: Currency in which the prices are requested
          schema:
            $ref: '#/components/schemas/Currency'
      tags:
        - HistoricalSecurityPrice
      operationId: getHistoricalSecurityPrices
      responses:
        '200':
          description: Successfully returned the security's historical prices, or an empty array if the security has none
          content:
            application/json:
              schema:
                type: array
                nullable: false
                minItems: 0
                items:
                  $ref: '#/components/schemas/HistoricalSecurityPrice'
        '400':
          description: One or more of the parameters are syntactically or semantically incorrect
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            One of these errors may have occurred:
            - the given security does not exist
            - there is no foreign exchange rate available to convert the prices to the requested currency

  /securities/{securityId}/historical-prices/config:
    parameters:
      - in: path
        name: securityId
        required: true
        description: identifies the security
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags:
        - HistoricalSecurityPriceConfig
      operationId: getHistoricalSecurityPriceConfig
      responses:
        '200':
          description: Successfully returned the security's historical price config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSecurityPriceConfigRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No historical security price config exists for the specified securityId, or the security does not exist
    post:
      tags:
        - HistoricalSecurityPriceConfig
      operationId: createHistoricalSecurityPriceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalSecurityPriceConfigCreate'
      responses:
        '201':
          description: Successfully created the security's historical price config
          headers:
            location:
              required: true
              schema:
                type: string
                nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSecurityPriceConfigRead'
        '400':
          description: Passed invalid parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The security identified by securityId does not exist
        '409':
          description: A historical security price config exists already for the specified securityId
    put:
      parameters:
        - in: query
          name: removeExistingPrices
          required: false
          description: >
            If true, will remove the existing prices. In case the configuration is deactivated, no new prices will be
            loaded. Otherwise, the existing prices will be replaced with whatever the new config yields.
          schema:
            type: boolean
            nullable: false
            default: false
            example: true
      tags:
        - HistoricalSecurityPriceConfig
      operationId: updateHistoricalSecurityPriceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalSecurityPriceConfigUpdate'
      responses:
        '200':
          description: Successfully updated the security's historical price config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalSecurityPriceConfigRead'
        '400':
          description: Passed invalid parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No historical security price config exists for the specified securityId, or the security does not exist
        '409':
          description: Optimistic Lock failed

components:
  responses:
    Unauthorized:
      description: |
        The request carried no valid credentials, or credentials the server rejected. A deployment that does not authenticate never
        answers this, and a caller must not treat its absence as a promise that the endpoint is open.
    Forbidden:
      description: |
        The caller is authenticated but not permitted to perform this operation - a read-only registration issuing a write, for
        instance. A deployment that does not authorize never answers this.

  schemas:
    Id:
      type: integer
      format: int64
      nullable: false
      minimum: 1
      example: 1

    Version:
      description: Required for the optimistic locking mechanism
      type: integer
      format: int64
      nullable: false
      minimum: 0
      example: 1

    Currency:
      type: string
      nullable: false
      pattern: ^[A-Z]{3}$
      example: USD

    HistoricalSecurityPrice:
      type: object
      nullable: false
      required:
        - securityId
        - price
        - currency
        - date
      properties:
        securityId:
          $ref: '#/components/schemas/Id'
        price:
          type: number
          nullable: false
          minimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        date:
          type: string
          format: date
          nullable: false
          example: 2023-12-22

    ExternalSecurityId:
      type: string
      nullable: false
      minLength: 1
      maxLength: 255
      example: MSF

    HistoricalSecurityPriceConfigCreate:
      type: object
      nullable: false
      required:
        - dataSourceId
        - isActive
      properties:
        dataSourceId:
          $ref: '#/components/schemas/Id'
        externalSecurityId:
          $ref: '#/components/schemas/ExternalSecurityId'
        isActive:
          type: boolean
          nullable: false
          example: true

    HistoricalSecurityPriceConfigUpdate:
      allOf:
        - $ref: '#/components/schemas/HistoricalSecurityPriceConfigCreate'
        - type: object
          nullable: false
          required:
            - version
          properties:
            version:
              $ref: '#/components/schemas/Version'

    HistoricalSecurityPriceConfigRead:
      allOf:
        - $ref: '#/components/schemas/HistoricalSecurityPriceConfigUpdate'
        - type: object
          nullable: false
          required:
            - securityId
            - externalSecurityId
          properties:
            securityId:
              $ref: '#/components/schemas/Id'
            externalSecurityId:
              $ref: '#/components/schemas/ExternalSecurityId'

    CurrencyMapping:
      type: object
      nullable: false
      required:
        - currencyKey
        - mappedCurrencyCode
      properties:
        currencyKey:
          type: string
          nullable: false
          minLength: 0
          maxLength: 255
          example: GBp
        mappedCurrencyCode:
          $ref: '#/components/schemas/Currency'
        multiplier:
          type: number
          nullable: false
          example: 0.01

    Name:
      type: string
      nullable: false
      minLength: 1
      maxLength: 255
      example: Some name

    RequestHeader:
      type: object
      nullable: false
      required:
        - headerName
        - headerValue
      properties:
        headerName:
          type: string
          nullable: false
          minLength: 1
          maxLength: 255
          example: X-API-Key
        headerValue:
          type: string
          nullable: false
          minLength: 0
          example: someSecretApiKey

    DateFormat:
      type: string
      nullable: false
      example: CUSTOM_STRING
      enum:
        - TIMESTAMP_SECONDS
        - TIMESTAMP_MILLISECONDS
        - CUSTOM_STRING

    DateConfiguration:
      type: object
      nullable: false
      required:
        - format
      properties:
        format:
          $ref: '#/components/schemas/DateFormat'
        customPattern:
          type: string
          nullable: false
          minLength: 1
          maxLength: 255
          example: 'yyyy-MM-dd'

    HistoricalSecurityPriceUrlPattern:
      type: object
      nullable: false
      required:
        - timespanInDays
        - urlPattern
      properties:
        timespanInDays:
          description: Determines for how many days in the past this URL will return historical prices.
          type: integer
          format: int32
          nullable: false
          minimum: 1
        urlPattern:
          description: >
            Must contain at least one '#id()', or at least one '#id(isin)'. Every URL assigned to a data source must have the same
            placeholder for external security IDs. A mixture is not allowed. The placeholders will be replaced for contacting the data
            source as follows:
            - #id(): the configured external security ID
            - #id(isin): the security's ISIN
          type: string
          nullable: false
          minLength: 1
          example: https://stock.api/#id(isin)/prices

    ZonedTime:
      type: object
      nullable: false
      required:
        - time
        - timeZone
      properties:
        time:
          type: string
          nullable: false
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          example: 17:30:00
        timeZone:
          description: Timezone ID as per IANA time zone database
          type: string
          nullable: false
          minLength: 1
          maxLength: 255
          example: America/New_York

    HistoricalSecurityPriceDataSourceCreate:
      type: object
      nullable: false
      required:
        - name
        - urlPatterns
        - requestHeaders
        - jsonPathDate
        - dateFormat
        - jsonPathValue
        - currencyMappings
        - marketCloseTimes
      properties:
        name:
          $ref: '#/components/schemas/Name'
        urlPatterns:
          type: array
          nullable: false
          minItems: 1
          items:
            $ref: '#/components/schemas/HistoricalSecurityPriceUrlPattern'
        requestHeaders:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/RequestHeader'
        jsonPathDate:
          type: string
          minLength: 1
          nullable: false
          example: $.prices[*].date
        dateFormat:
          $ref: '#/components/schemas/DateConfiguration'
        jsonPathValue:
          type: string
          minLength: 1
          nullable: false
          example: $.prices[*].dividendPayment
        jsonPathCurrency:
          description: When set, the currency will be read from the JSON response. Otherwise, it will be read from the external security ID.
          type: string
          minLength: 1
          nullable: false
          example: $.currency
        regexCurrency:
          type: string
          minLength: 1
          nullable: false
          example: "^."
        regexCurrencyGroup:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          example: 1
        currencyMappings:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/CurrencyMapping'
        marketCloseTimes:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/ZonedTime'

    HistoricalSecurityPriceDataSourceUpdate:
      allOf:
        - $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceCreate'
        - type: object
          nullable: false
          required:
            - version
          properties:
            version:
              $ref: '#/components/schemas/Version'

    HistoricalSecurityPriceDataSourceRead:
      allOf:
        - $ref: '#/components/schemas/HistoricalSecurityPriceDataSourceUpdate'
        - type: object
          nullable: false
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/Id'
