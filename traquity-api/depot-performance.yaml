openapi: 3.0.3

info:
  title: Depot Performance API
  description: The API definitions for querying performance information
  version: 1.0.0

servers:
  - url: 'http://localhost:23726'
    description: Locally serving the API

paths:
  /depot-performance:
    get:
      parameters:
        - $ref: '#/components/parameters/DepotIds'
      tags:
        - DepotPerformance
      operationId: getDepotPerformance
      responses:
        '200':
          description: Successfully returned the depot values, with an empty values array if none exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepotPerformance'
        '400':
          description: Specified depot IDs reference depots with different currencies or syntactically malformed query parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: At least one of the specified depot IDs does not exist

  /depot-performance/income:
    get:
      parameters:
        - $ref: '#/components/parameters/DepotIds'
        - in: query
          name: securityIds
          required: true
          description: identifies the securities the income is reported for
          schema:
            $ref: '#/components/schemas/SecurityIds'
        - in: query
          name: incomeTypes
          required: true
          description: which kinds of income are reported
          schema:
            type: array
            nullable: false
            minItems: 1
            items:
              $ref: '#/components/schemas/IncomeType'
      tags:
        - DepotPerformanceIncome
      operationId: getIncome
      responses:
        '200':
          description: Successfully returned the income, or an empty array if none exists
          content:
            application/json:
              schema:
                type: array
                nullable: false
                minItems: 0
                items:
                  $ref: '#/components/schemas/Performance'
        '400':
          description: '''
            - passed invalid query parameters
            - not all depots have the same currency
            '''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: At least one of the specified depot IDs does not exist

  /depot-performance/position:
    get:
      parameters:
        - $ref: '#/components/parameters/DepotIds'
        - in: query
          name: securityIds
          required: false
          description: Identifies the securities the position performance is reported for. If omitted, all securities/transactions count.
          schema:
            $ref: '#/components/schemas/SecurityIds'
      tags:
        - DepotPerformancePosition
      operationId: getPositionPerformance
      responses:
        '200':
          description: Successfully returned the position performance, with zero amounts if the selection has no transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionPerformance'
        '400':
          description: |
            - Specified depot IDs reference depots with different currencies
            - syntactically malformed query parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: At least one of the specified depot or security IDs does not exist

components:
  parameters:
    DepotIds:
      in: query
      name: depotIds
      required: true
      description: identifies the depots
      schema:
        type: array
        nullable: false
        minItems: 1
        items:
          $ref: '#/components/schemas/Id'

  responses:
    Unauthorized:
      description: |
        The request carried no valid credentials, or credentials the server rejected. A deployment that does not authenticate never
        answers this, and a caller must not treat its absence as a promise that the endpoint is open.
    Forbidden:
      description: |
        The caller is authenticated but not permitted to perform this operation - a read-only registration issuing a write, for
        instance. A deployment that does not authorize never answers this.

  schemas:
    Id:
      type: integer
      format: int64
      nullable: false
      minimum: 1
      example: 1

    Currency:
      type: string
      nullable: false
      pattern: ^[A-Z]{3}$
      example: USD

    SecurityIds:
      type: array
      nullable: false
      minItems: 1
      items:
        $ref: '#/components/schemas/Id'

    IncomeType:
      type: string
      nullable: false
      example: DIVIDEND
      enum:
        - DIVIDEND
        - SELL
        - OTHER

    Performance:
      type: object
      nullable: false
      required:
        - securityIds
        - transactions
        - absoluteValueGross
        - absoluteValueNet
      properties:
        securityIds:
          type: array
          nullable: false
          minItems: 1
          items:
            $ref: '#/components/schemas/Id'
        transactions:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/TransactionReference'
        absoluteValueGross:
          type: number
          nullable: false
        absoluteValueNet:
          type: number
          nullable: false

    TransactionReference:
      type: object
      nullable: false
      required:
        - depotId
        - transactionId
      properties:
        depotId:
          $ref: '#/components/schemas/Id'
        transactionId:
          $ref: '#/components/schemas/Id'

    DepotPerformance:
      type: object
      nullable: false
      required:
        - values
        - extendedInternalRateOfReturn
      properties:
        values:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/DepotValue'
        extendedInternalRateOfReturn:
          description: 'Extended Internal Rate of Return (XIRR). Example: 10% XIRR is represented by value 0.1'
          type: number
          nullable: false
          example: 0.1

    DepotValue:
      type: object
      nullable: false
      required:
        - date
        - investedCapital
        - cashPosition
        - absoluteValue
        - performanceAbsolute
        - performanceRelative
      properties:
        date:
          type: string
          format: date
          nullable: false
          example: 2023-12-22
        investedCapital:
          type: number
          nullable: false
        cashPosition:
          type: number
          nullable: false
        absoluteValue:
          type: number
          nullable: false
        performanceAbsolute:
          description: absoluteValue - investedCapital
          type: number
          nullable: false
        performanceRelative:
          description: performanceAbsolute / investedCapital, as a percentage (e.g. 0.1 meaning 10%)
          type: number
          nullable: false

    PositionPerformance:
      description: |
        The total performance of a position over its whole transaction history, in the currency the selected depots share. The cash
        flow lines are signed contributions: money leaving is negative, money arriving is positive.
      type: object
      nullable: false
      required:
        - currency
        - buysGross
        - sellsGross
        - dividendsGross
        - taxes
        - fees
        - netCashFlow
        - currentSizeAbsolute
        - costBasis
        - performanceAbsolute
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        buysGross:
          description: what was paid for the bought shares, before taxes and fees
          type: number
          nullable: false
        sellsGross:
          description: what the sold shares yielded, before taxes and fees
          type: number
          nullable: false
        dividendsGross:
          description: what the dividends yielded, before taxes and fees
          type: number
          nullable: false
        taxes:
          type: number
          nullable: false
        fees:
          type: number
          nullable: false
        netCashFlow:
          description: buysGross + sellsGross + dividendsGross + taxes + fees
          type: number
          nullable: false
        currentSizeAbsolute:
          description: The current (latest known) value of the currently held share. May be zero if no shares are held.
          type: number
          nullable: false
        costBasis:
          description: all money put in - buys, taxes and fees - as a positive amount
          type: number
          nullable: false
        performanceAbsolute:
          description: netCashFlow + currentSizeAbsolute
          type: number
          nullable: false
        performanceRelative:
          description: |
            performanceAbsolute / costBasis, as a ratio (e.g. 0.1 meaning 10%). Absent when costBasis is equal to or lower than zero.
          type: number
          nullable: false
