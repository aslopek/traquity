openapi: 3.0.3

info:
  title: Depot Dividend API
  description: The API definitions for querying dividend information
  version: 1.0.0

servers:
  - url: 'http://localhost:23726'
    description: Locally serving the API

paths:
  /depot-dividends:
    get:
      tags:
        - Dividend
      parameters:
        - in: query
          name: depotIds
          required: true
          description: identifies the depots the dividends are aggregated over
          schema:
            type: array
            nullable: false
            minItems: 1
            items:
              $ref: '#/components/schemas/Id'
        - in: query
          name: includeSpecialDividends
          required: false
          description: When true, special dividends are counted alongside regular ones
          schema:
            type: boolean
            nullable: false
            default: false
            example: true
      operationId: getDividends
      responses:
        '200':
          description: Successfully returned the dividends, with empty arrays if none exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dividends'
        '400':
          description: '''
            - passed invalid query parameters
            - not all depots have the same currency
            '''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: At least one of the specified depot IDs does not exist

components:
  responses:
    Unauthorized:
      description: |
        The request carried no valid credentials, or credentials the server rejected. A deployment that does not authenticate never
        answers this, and a caller must not treat its absence as a promise that the endpoint is open.
    Forbidden:
      description: |
        The caller is authenticated but not permitted to perform this operation - a read-only registration issuing a write, for
        instance. A deployment that does not authorize never answers this.

  schemas:
    Id:
      type: integer
      format: int64
      nullable: false
      minimum: 1
      example: 1

    Dividends:
      type: object
      nullable: false
      required:
        - byYear
        - byQuarter
        - byMonth
        - dividendYield
      properties:
        byYear:
          description: Ordered by year ascending.
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/DividendsByYear'
        byQuarter:
          description: Ordered by year and quarter ascending.
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/DividendsByQuarter'
        byMonth:
          description: Ordered by year and month ascending.
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/DividendsByMonth'
        dividendYield:
          description: '''
            Contains further calculations on the dividend yield for each security with at least three regular dividend
            payments.
            '''
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/DividendYield'

    DividendBase:
      type: object
      nullable: false
      required:
        - securityIds
        - displayName
      properties:
        securityIds:
          description: '''Contains the security IDs associated to this dividend. If more than one ID is provided,
                          the securityGroupId is provided as well.'''
          type: array
          nullable: false
          minItems: 1
          items:
            $ref: '#/components/schemas/Id'
        displayName:
          description: '''Suggested display name for the dividend. If exactly one security matches this dividend, it is
                          the security name. Otherwise, it is the security group name.'''
          type: string
          nullable: false
          minLength: 1
          maxLength: 255
          example: Microsoft
        securityGroupId:
          $ref: '#/components/schemas/Id'

    DividendYield:
      allOf:
        - $ref: '#/components/schemas/DividendBase'
        - type: object
          nullable: false
          required:
            - estimatedPaymentGross
            - estimatedPaymentNet
            - regularDividendPaymentsPerYear
          properties:
            estimatedPaymentGross:
              description: Estimated payment per year based on the latest regular payment (gross value).
              type: number
              nullable: false
            estimatedPaymentNet:
              description: Estimated payment per year based on the latest regular payment (net value).
              type: number
              nullable: false
            currentYieldGross:
              description: >
                estimatedPaymentGross / current position size as a percentage (e.g. 0.1 meaning 10%). 0 if both are 0. Absent if only the
                current position size is 0, meaning an infinite yield.
              type: number
              nullable: false
              minimum: 0
            currentYieldNet:
              description: >
                estimatedPaymentNet / current position size as a percentage (e.g. 0.1 meaning 10%). 0 if both are 0. Absent if only the
                current position size is 0, meaning an infinite yield.
              type: number
              nullable: false
              minimum: 0
            yieldOnCostGross:
              description: >
                estimatedPaymentGross / buy-in position size as a percentage (e.g. 0.1 meaning 10%). 0 if both are 0. Absent if only the
                buy-in position size is 0, meaning an infinite yield.
              type: number
              nullable: false
              minimum: 0
            yieldOnCostNet:
              description: >
                estimatedPaymentNet / buy-in position size as a percentage (e.g. 0.1 meaning 10%). 0 if both are 0. Absent if only the
                buy-in position size is 0, meaning an infinite yield.
              type: number
              nullable: false
              minimum: 0
            regularDividendPaymentsPerYear:
              description: '''
                The number of regular dividend payments per year. Calculated by comparing the pay dates of the three most
                recent dividend payments.
                '''
              type: integer
              format: int32
              nullable: false
              minimum: 1

    Dividend:
      allOf:
        - $ref: '#/components/schemas/DividendBase'
        - type: object
          nullable: false
          required:
            - absoluteValueGross
            - absoluteValueNet
            - relativeValueGross
            - relativeValueNet
          properties:
            absoluteValueGross:
              type: number
              nullable: false
            absoluteValueNet:
              type: number
              nullable: false
            relativeValueGross:
              description: Percentage (e.g. 0.1 meaning 10%)
              type: number
              nullable: false
            relativeValueNet:
              description: Percentage (e.g. 0.1 meaning 10%)
              type: number
              nullable: false

    DividendsByYear:
      type: object
      nullable: false
      required:
        - year
        - sumGross
        - sumNet
        - dividends
      properties:
        year:
          type: integer
          format: int32
          nullable: false
        sumGross:
          description: Sum of all dividends.absoluteValueGross
          type: number
          nullable: false
          minimum: 0
        sumNet:
          description: Sum of all dividends.absoluteValueNet
          type: number
          nullable: false
          minimum: 0
        dividends:
          type: array
          nullable: false
          minItems: 0
          items:
            $ref: '#/components/schemas/Dividend'

    DividendsByQuarter:
      allOf:
        - $ref: '#/components/schemas/DividendsByYear'
        - type: object
          nullable: false
          required:
            - quarter
          properties:
            quarter:
              type: integer
              nullable: false
              format: int32
              minimum: 1
              maximum: 4

    DividendsByMonth:
      allOf:
        - $ref: '#/components/schemas/DividendsByYear'
        - type: object
          nullable: false
          required:
            - month
          properties:
            month:
              type: integer
              nullable: false
              format: int32
              minimum: 1
              maximum: 12
