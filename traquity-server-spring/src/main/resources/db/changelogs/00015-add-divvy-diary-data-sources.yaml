databaseChangeLog:
  - changeSet:
      id: 15
      author: Armin Slopek
      description: Add Divvy Diary as a preconfigured data source for historical security prices and dividend announcements
      changes:
        # NAME is unique in both tables, so a data source a user already defined under this name would make the inserts below fail. The
        # suffix only renames that row and leaves its id alone, so the securities bound to it keep reaching it.
        - update:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE
            columns:
              - column:
                  name: NAME
                  value: "Divvy Diary (custom)"
            where: "NAME = 'Divvy Diary'"

        - update:
            tableName: DIVIDEND_ANNOUNCEMENT_DATA_SOURCE
            columns:
              - column:
                  name: NAME
                  value: "Divvy Diary (custom)"
            where: "NAME = 'Divvy Diary'"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE
            columns:
              - column:
                  name: ID
                  valueNumeric: 3
              - column:
                  name: CREATED_AT
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: UPDATED_AT
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: VERSION
                  valueNumeric: 0
              - column:
                  name: NAME
                  value: Divvy Diary
              - column:
                  name: JSON_PATH_DATE
                  value: $.quotes[*].date
              - column:
                  name: DATE_FORMAT
                  value: yyyy-MM-dd
              - column:
                  name: JSON_PATH_VALUE
                  value: $.quotes[*].price
              - column:
                  name: JSON_PATH_CURRENCY
                  value: $.currency

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_REQUEST_HEADER
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: HEADER_NAME
                  value: X-Api-Key
              - column:
                  name: HEADER_VALUE
                  value: "#mask()"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_URL
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIMESPAN_IN_DAYS
                  valueNumeric: 1
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()/quotes?from=#date(yyyy-MM-dd,1)"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_URL
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIMESPAN_IN_DAYS
                  valueNumeric: 7
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()/quotes?from=#date(yyyy-MM-dd,7)"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_URL
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIMESPAN_IN_DAYS
                  valueNumeric: 30
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()/quotes?from=#date(yyyy-MM-dd,30)"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_URL
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIMESPAN_IN_DAYS
                  valueNumeric: 365
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()/quotes?from=#date(yyyy-MM-dd,365)"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_DATA_SOURCE_URL
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIMESPAN_IN_DAYS
                  valueNumeric: 999999
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()/quotes"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_MARKET_CLOSE_TIME
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIME_ZONE
                  value: America/New_York
              - column:
                  name: TIME
                  value: "16:00:00"

        - insert:
            tableName: HISTORICAL_SECURITY_PRICE_MARKET_CLOSE_TIME
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 3
              - column:
                  name: TIME_ZONE
                  value: Europe/Berlin
              - column:
                  name: TIME
                  value: "22:00:00"

        - insert:
            tableName: DIVIDEND_ANNOUNCEMENT_DATA_SOURCE
            columns:
              - column:
                  name: ID
                  valueNumeric: 1
              - column:
                  name: CREATED_AT
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: UPDATED_AT
                  valueComputed: CURRENT_TIMESTAMP
              - column:
                  name: VERSION
                  valueNumeric: 0
              - column:
                  name: NAME
                  value: Divvy Diary
              - column:
                  name: URL_PATTERN
                  value: "https://api.divvydiary.com/symbols/#id()"
              - column:
                  name: JSON_PATH_DATE
                  value: $.dividends[*].payDate
              - column:
                  name: DATE_FORMAT
                  value: yyyy-MM-dd
              - column:
                  name: JSON_PATH_VALUE
                  value: $.dividends[*].amount
              - column:
                  name: JSON_PATH_CURRENCY
                  value: $.dividends[*].currency

        - insert:
            tableName: DIVIDEND_ANNOUNCEMENT_DATA_SOURCE_REQUEST_HEADER
            columns:
              - column:
                  name: DATA_SOURCE_ID
                  valueNumeric: 1
              - column:
                  name: HEADER_NAME
                  value: X-Api-Key
              - column:
                  name: HEADER_VALUE
                  value: "#mask()"
