name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-versions.js

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # No checkout (actions/checkout): the action compares the base and head dependency graphs over the API
      - uses: actions/dependency-review-action@v5
        with:
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            CC0-1.0, Unlicense, MPL-2.0, EPL-1.0, EPL-2.0, OFL-1.1
          # Exceptions - see architecture/licensing.md.
          allow-dependencies-licenses: >-
            pkg:maven/com.h2database/h2,
            pkg:maven/org.liquibase/liquibase-core

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traquity-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: traquity-api/package-lock.json
      # `storageDir` in openapitools.json, holding the ~32 MB generator jar that every `validate` and `generate` call pulls down on a miss
      - uses: actions/cache@v6
        with:
          path: openapigen
          key: openapigen-${{ hashFiles('*/openapitools.json') }}
      - run: npm ci
      - run: npm test

  angular-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traquity-client-angular
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: traquity-client-angular/package-lock.json
      # `storageDir` in openapitools.json, holding the ~32 MB generator jar that every `validate` and `generate` call pulls down on a miss
      - uses: actions/cache@v6
        with:
          path: openapigen
          key: openapigen-${{ hashFiles('*/openapitools.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run licenses:check

  spring-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traquity-server-spring
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - run: mvn -B verify
