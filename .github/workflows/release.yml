name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none releases the current version as-is)'
        type: choice
        options: [ patch, minor, none ]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # RELEASE_TOKEN rotation & required scopes — see MAINTAINING.md
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: bump
        run: node scripts/prepare-release.js "${{ inputs.bump }}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            traquity-client-angular/package.json traquity-client-angular/package-lock.json \
            traquity-server-spring/pom.xml
          git commit -m "Release v${{ steps.bump.outputs.version }}" --allow-empty
          git tag "${{ steps.bump.outputs.version }}"
          git push origin main "${{ steps.bump.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          # Consumed by `publish` in the same run; the notes live on in the published release.
          retention-days: 1

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: traquity-client-angular/package-lock.json
      - run: mvn -B package
        working-directory: traquity-server-spring
      - run: npm ci
        working-directory: traquity-client-angular
      - run: npm run build
        working-directory: traquity-client-angular
      - run: npm test
        working-directory: traquity-client-angular
      - run: npm run licenses:check
        working-directory: traquity-client-angular
      - run: npm run electron:pack
        working-directory: traquity-client-angular
      - name: Collect artifacts
        shell: bash
        working-directory: traquity-client-angular
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p release-artifacts
          # Every archive holds the complete packaged directory rather than the executable alone. electron-packager
          # lays the Electron distribution down around the app, and LICENSE plus LICENSES.chromium.html are part of
          # it
          case "${{ runner.os }}" in
            Windows)
              7z a "release-artifacts/traquity-${version}-windows-x64.zip" ./out/TraQuity-win32-x64 ;;
            macOS)
              # ditto rather than zip, so the bundle's symlinks and extended attributes survive the round trip
              ditto -c -k --sequesterRsrc --keepParent out/TraQuity-darwin-arm64 \
                "release-artifacts/traquity-${version}-macos-arm64.zip" ;;
            Linux)
              tar -czf "release-artifacts/traquity-${version}-linux-x64.tar.gz" -C out TraQuity-linux-x64 ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: traquity-client-angular/release-artifacts/*
          if-no-files-found: error
          # A packaged Electron distribution per OS, handed to `publish` minutes later and attached to the release there. Keeping the same
          # bytes in the artifact store for the 90-day default would duplicate the whole download for no reader.
          retention-days: 1

  publish:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: |
          gh release create "${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "TraQuity ${{ needs.prepare.outputs.version }}" \
            --notes-file artifacts/release-notes/release-notes.md \
            artifacts/dist-*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
