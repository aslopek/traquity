<div class="unlock">
    <app-about-button class="unlock__about"></app-about-button>

    <section class="unlock__card">
        <img alt=""
             class="unlock__logo"
             src="./assets/logo.png"/>

        <h1 class="unlock__file-name">
            {{ startupStore.databasePath() | fileName:'.mv.db' }}
        </h1>
        <p class="unlock__path tq-muted">
            {{ startupStore.databasePath() }}
        </p>

        <mat-form-field class="unlock__field">
            <mat-label>Password</mat-label>
            <input #passwordInput
                   matInput
                   [type]="unlockStore.passwordVisible() ? 'text' : 'password'"
                   [value]="unlockStore.password()"
                   (input)="unlockStore.setPassword($any($event.target).value)"
                   (keyup.enter)="unlockStore.submit()">
            <button matSuffix
                    mat-icon-button
                    type="button"
                    [attr.aria-label]="unlockStore.passwordVisible() ? 'Hide password' : 'Show password'"
                    [matTooltip]="unlockStore.passwordVisible() ? 'Hide password' : 'Show password'"
                    (click)="unlockStore.togglePasswordVisibility()">
                <mat-icon [fontIcon]="unlockStore.passwordVisible() ? 'visibility_off' : 'visibility'"></mat-icon>
            </button>
        </mat-form-field>

        @if (startupStore.startFailed()) {
            <div class="tq-notice tq-notice--error">
                <mat-icon class="tq-notice__icon"
                          fontIcon="error"></mat-icon>
                <span>Wrong password or corrupted database.</span>
            </div>
        }

        <div class="unlock__actions">
            <button matButton="outlined"
                    (click)="unlockStore.cancel()">
                Cancel
            </button>
            <button matButton="filled"
                    [disabled]="!unlockStore.canSubmit()"
                    (click)="unlockStore.submit()">
                OK
            </button>
        </div>

        <button matButton
                class="unlock__alternative"
                (click)="unlockStore.useDifferentDatabase()">
            Use a different database…
        </button>
    </section>
</div>
