@let group = securityGroup();
<div class="security-group-card"
     [class.security-group-card--selected]="isSelected()"
     [class.security-group-card--new]="group === 'new'"
     (click)="clickSecurityGroup()">
    @if (group !== 'new' && group.securities.length > 0) {
        <security-logo [securityId]="group.securities[0]"></security-logo>
    }

    <div class="security-group-card__info">
        <span class="security-group-card__name tq-truncate">
            @if (group === 'new') {
                Add new security group
            } @else {
                {{ group.name }}
            }
        </span>
        @if (group !== 'new') {
            <span class="security-group-card__count tq-numeric">
                {{ group.securities.length }} securities
            </span>
        }
    </div>

    <button class="security-group-card__action"
            type="button"
            [attr.aria-label]="group === 'new' ? 'Add security group' : 'Delete security group'"
            (click)="clickSideButton($event)">
        @if (group === 'new') {
            <mat-icon fontIcon="add"></mat-icon>
        } @else {
            <mat-icon fontIcon="delete"></mat-icon>
        }
    </button>
</div>
