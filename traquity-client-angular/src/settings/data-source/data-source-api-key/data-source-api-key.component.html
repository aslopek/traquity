@let dataSource = selectedDataSource();
@if (dataSource !== null) {
    <section class="tq-card api-key">
        <header class="tq-card__head">
            <h3 class="tq-card__title">{{ dataSource.name }}</h3>
        </header>

        <mat-form-field>
            <mat-label>API Key</mat-label>
            <input matInput
                   [value]="apiKey()"
                   (input)="onApiKeyInput($event)">
        </mat-form-field>

        <div class="api-key__actions">
            <button matButton
                    (click)="cancel()">
                Cancel
            </button>
            <button matButton="filled"
                    [disabled]="!canSave()"
                    (click)="save()">
                Save
            </button>
        </div>
    </section>
}
