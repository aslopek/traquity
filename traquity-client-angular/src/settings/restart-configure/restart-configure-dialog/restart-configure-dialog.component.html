<app-title-toolbar (onClose)="cancel()"
                   title="Restart &amp; configure database">
</app-title-toolbar>

<div class="tq-dialog__body">
    <p class="tq-muted">The app restarts and opens the configuration screen.</p>
</div>

<div class="tq-dialog__actions">
    <button (click)="cancel()"
            matButton>
        Cancel
    </button>
    <button (click)="confirm()"
            matButton="filled">
        Restart &amp; configure
    </button>
</div>
