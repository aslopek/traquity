<div class="step">
    <input #fileUpload
           (change)="selectFile($event)"
           accept=".csv,text/csv"
           class="step__file-input"
           type="file">

    <div class="step__row">
        <button (click)="fileUpload.click()"
                matButton="filled">
            Select File
        </button>
        <span class="tq-field-hint">A CSV export from your broker</span>
    </div>

    @if (transactionImportStore.fileName(); as fileName) {
        <div class="step__summary">
            <div class="step__summary-row">
                <span class="tq-muted">File</span>
                <span class="tq-truncate">{{ fileName }}</span>
            </div>
            <div class="step__summary-row">
                <span class="tq-muted">Parsed rows</span>
                <span class="tq-numeric">{{ transactionImportStore.rows().length }}</span>
            </div>
        </div>

        @if (transactionImportStore.separator() === null) {
            <div class="tq-notice tq-notice--error">
                <mat-icon class="tq-notice__icon"
                          fontIcon="error"></mat-icon>
                <span>Could not detect a column separator. Please check the file format.</span>
            </div>
        }
    }

    <div class="step__actions">
        <button [disabled]="!canProceed()"
                matButton="filled"
                matStepperNext>
            Next
        </button>
    </div>
</div>
