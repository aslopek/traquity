<app-title-toolbar (onClose)="cancel()"
                   title="Delete Transaction">
</app-title-toolbar>

<div class="tq-dialog__body">
    <div class="tq-notice tq-notice--error">
        <mat-icon class="tq-notice__icon"
                  fontIcon="warning"></mat-icon>
        <span>This transaction will be removed permanently.</span>
    </div>

    <div class="transaction-delete__summary">
        <div class="transaction-delete__row">
            <span class="tq-muted">Security</span>
            <span>{{ securityName }}</span>
        </div>
        <div class="transaction-delete__row">
            <span class="tq-muted">Type</span>
            <span class="transaction-delete__type">
                <mat-icon [fontIcon]="transaction.transactionType | transactionTypeDisplayIcon"></mat-icon>
                {{ transaction.transactionType | transactionTypeDisplayName }}
            </span>
        </div>
        <div class="transaction-delete__row">
            <span class="tq-muted">Date</span>
            <span class="tq-numeric">{{ transaction.date | tqDate }}</span>
        </div>
    </div>
</div>

<div class="tq-dialog__actions">
    <button (click)="cancel()"
            matButton>
        Cancel
    </button>
    <button (click)="deleteTransaction()"
            class="tq-danger"
            matButton="filled">
        Delete
    </button>
</div>
