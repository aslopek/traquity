<section class="transaction-group tq-card tq-card--flush">
    <header class="transaction-group__head">
        <span class="tq-section-label">{{ groupedTransactions()[0]?.date | tqDate }}</span>
    </header>

    <div class="transaction-group__rows">
        @for (transaction of groupedTransactions(); track transaction.id) {
            <div class="transaction-group__row">
                <mat-icon class="transaction-group__icon"
                          [class]="'transaction-group__icon--' + transaction.transactionType.toLowerCase()"
                          [matTooltip]="transaction.transactionType | transactionTypeDisplayName"
                          [fontIcon]="transaction.transactionType | transactionTypeDisplayIcon">
                </mat-icon>

                <security-logo [securityId]="transaction.securityId"
                               size="small">
                </security-logo>

                <span class="transaction-group__name tq-truncate">
                    {{ transaction.securityId | securityName }}
                </span>

                <span class="transaction-group__value tq-numeric">
                    {{ transaction.cashFlow | tqCurrency:currency() }}
                </span>
            </div>
        }
    </div>
</section>
